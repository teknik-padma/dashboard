<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F5F7FB" id="warnaBilah">
<title>Dashboard Padma Group</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@800&display=swap">
<script>
/* Tema diputuskan SEBELUM cat pertama: yang terakhir dikirim dashboard
   (localStorage halaman ini), kalau belum pernah -> tema perangkat. */
(function () {
  var h = document.documentElement, t = null, b = null;
  try { t = localStorage.getItem('padmaTema'); b = localStorage.getItem('padmaBawah'); } catch (e) {}
  if (t !== 'dark' && t !== 'light') t = (window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches) ? 'dark' : 'light';
  h.setAttribute('data-tema', t);
  if (b) h.style.setProperty('--bawah', b);
})();
</script>
<style>
  :root { --latar: #F5F7FB; --garis: #111827; --bawah: #FFFFFF; }
  html[data-tema="dark"] { --latar: #000000; --garis: #FFFFFF; --bawah: #16181C; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: var(--bawah); }
  /* Ruang bawah seperti aplikasi: area garis navigasi HP (safe-area) TIDAK
     ditimpa iframe -- iframe tidak mengenal inset itu -- tapi diisi warna
     bilah bawah dashboard. */
  iframe {
    position: fixed; top: 0; left: 0; width: 100%;
    height: calc(100% - env(safe-area-inset-bottom, 0px));
    border: 0; display: block;
  }
  #muat {
    position: fixed; inset: 0; z-index: 2; background: var(--latar); color: var(--garis);
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    transition: opacity .26s ease;
  }
  #muat.lepas { opacity: 0; pointer-events: none; }
  #laser { width: 104px; height: 104px; overflow: visible; }
  /* Tulisan merek muncul SESUDAH ukiran selesai; tempatnya dipegang sejak awal
     supaya logo tidak bergeser naik waktu tulisannya datang. */
  .merek {
    margin-top: 22px; font: 800 15px/1 Inter, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    letter-spacing: .22em; padding-left: .22em;
    opacity: 0; transform: translateY(6px); transition: opacity .6s ease, transform .6s ease;
  }
  #muat.selesai .merek { opacity: 1; transform: none; }
  @media (prefers-reduced-motion: reduce) { #muat, .merek { transition: none; } }
</style>
</head>

<iframe id="dasbor" src="https://script.google.com/macros/s/AKfycbzBRPeuPWoL3UdErFpn9WngpqQNiqvf9zH0dOhAsNEGlI1s9Uhm0XIGkWwalLctpwwR/exec"
        title="Dashboard Padma Group"
        allow="camera; clipboard-read; clipboard-write; fullscreen; geolocation"></iframe>
<script>
/* Pembungkus Dashboard Padma Group (2026-09-24). Layar muat = laser mengukir
   logo SEKALI (6000 ms, gerak sama dengan dashboard/APK) lalu tulisan PADMA GROUP,
   dilepas waktu dashboard mengirim "siap" (postMessage). Pesan hanya diterima
   dari domain Google. Jaring pengaman 25 dtk; ?tahan=1 menahan layar ini (uji). */
(function () {
  var muat = document.getElementById('muat');
  var h = document.documentElement;
  var bilah = document.getElementById('warnaBilah');
  var jalan = true, mulai = Date.now();
  var TAHAN = /[?&]tahan=1/.test(location.search);

  function simpan(k, v) { try { localStorage.setItem(k, v); } catch (e) {} }
  function lepas() {
    if (!jalan || TAHAN) return;
    jalan = false;
    muat.classList.add('lepas');
    setTimeout(function () { muat.style.display = 'none'; }, 300);
  }
  function warnaBilah() {
    var c = getComputedStyle(h).getPropertyValue('--bawah').trim();
    if (c) bilah.setAttribute('content', c);
  }
  warnaBilah();

  window.addEventListener('message', function (e) {
    var asal = String(e.origin || '');
    if (!/^https:\/\/([a-z0-9-]+\.)*(googleusercontent\.com|google\.com)$/.test(asal)) return;
    var d = e.data;
    if (!d || d.padma !== 1) return;
    if ((d.jenis === 'tema' || d.jenis === 'warna') && (d.tema === 'dark' || d.tema === 'light')) {
      h.setAttribute('data-tema', d.tema);
      simpan('padmaTema', d.tema);
    }
    if (d.jenis === 'warna' && typeof d.bawah === 'string' && /^rgba?\([\d.,\s]+\)$|^#[0-9a-f]{3,8}$/i.test(d.bawah)) {
      h.style.setProperty('--bawah', d.bawah);
      simpan('padmaBawah', d.bawah);
      warnaBilah();
    }
    if (d.jenis === 'siap') lepas();
  });
  setTimeout(lepas, 25000);

  /* Laser: gerak yang sama dengan agLaserMulai_ di Index.html. */
  var svg = document.getElementById('laser');
  var gores = Array.prototype.slice.call(svg.querySelectorAll('.agl-gores'));
  var titik = svg.querySelector('.agl-titik');
  var pj = gores.map(function (g) { var l = g.getTotalLength(); g.style.strokeDasharray = l; g.style.strokeDashoffset = l; return l; });
  var ruas = [], total = 0;
  gores.forEach(function (g, i) {
    if (i > 0) {
      var a = gores[i - 1].getPointAtLength(pj[i - 1]), b = g.getPointAtLength(0);
      var d = Math.hypot(b.x - a.x, b.y - a.y);
      if (d > 0.5) { ruas.push({ luncur: true, L: d * 0.35 }); total += d * 0.35; }
    }
    ruas.push({ luncur: false, i: i, L: pj[i] }); total += pj[i];
  });
  function mulus(x) { return x < 0.5 ? 2 * x * x : 1 - Math.pow(-2 * x + 2, 2) / 2; }
  /* SEKALI, tidak berulang (diminta): ukir 6000 ms lalu logo diam + tulisan
     PADMA GROUP sampai dashboard siap. Diputar rAF (selaras layar; dulu
     setTimeout 30 ms = patah-patah), dengan setTimeout sebagai cadangan kalau
     rAF tidak datang (tab di latar). */
  var UKIR = 6000;
  window.JEDA_LASER = [];
  var terakhir = 0;
  function berikut(fn) {
    var sudah = false;
    var jalankan = function () { if (!sudah) { sudah = true; fn(); } };
    if (window.requestAnimationFrame) requestAnimationFrame(jalankan);
    setTimeout(jalankan, 100);
  }
  (function langkah() {
    if (!jalan) return;
    var kini = Date.now();
    if (terakhir) window.JEDA_LASER.push(kini - terakhir);
    terakhir = kini;
    var t = Math.min(kini - mulai, UKIR);
    var sisa = total * mulus(t / UKIR), pos = null;
    ruas.forEach(function (s) {
      var ambil = Math.max(0, Math.min(s.L, sisa));
      if (!s.luncur) {
        gores[s.i].style.strokeDashoffset = pj[s.i] - ambil;
        pos = (ambil > 0 && ambil < s.L) ? gores[s.i].getPointAtLength(ambil) : (ambil > 0 ? null : pos);
      } else if (ambil > 0) pos = null;
      sisa -= ambil;
    });
    if (pos && t < UKIR) { titik.setAttribute('x', pos.x - 2.5); titik.setAttribute('y', pos.y - 2.5); titik.style.opacity = 1; }
    else titik.style.opacity = 0;
    if (t >= UKIR) { muat.classList.add('selesai'); return; }
    berikut(langkah);
  })();
})();
</script>
